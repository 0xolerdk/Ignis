name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libspatialindex-dev
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Cache node modules
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run Ruff
        run: python -m ruff check backend
      - name: Run Black
        run: python -m black --check backend
      - name: Type check
        run: python -m mypy backend
      - name: Run tests
        run: python -m pytest backend/tests
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Build backend docker image
        run: docker build -f backend/Dockerfile .
      - name: Build frontend docker image
        run: docker build -f frontend/Dockerfile frontend
